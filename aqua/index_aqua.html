<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer id="aqua" src="aqua.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" animation-name="rotate_action" camera-orbit="39.86deg 68.49deg 0.8858m" field-of-view="30deg">
      <button class="Hotspot" slot="hotspot-1" data-surface="0 0 8544 8545 8543 0.211 0.622 0.166" data-visibility-attribute="visible"onMouseOver="addhotspot1()"  onMouseOut="removehotspot1()">
          <div class="HotspotAnnotation" id="hotspot1" style="visibility:hidden">head</div>
      </button><button class="Hotspot" slot="hotspot-2" data-surface="1 0 2223 2157 2158 0.540 0.191 0.268" data-visibility-attribute="visible" onMouseOver="addhotspot2()"  onMouseOut="removehotspot2()">
          <div class="HotspotAnnotation" id="hotspot2"  style="visibility:hidden">handle</div>
      </button><button class="Hotspot" slot="hotspot-3" data-surface="2 0 1056 1057 1058 0.578 0.283 0.139" data-visibility-attribute="visible" onMouseOver="addhotspot3()"  onMouseOut="removehotspot3()">
          <div class="HotspotAnnotation" id="hotspot3"  style="visibility:hidden">body</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>

      <div style="position:absolute; bottom:0px; right:0px">
	<button onClick="setOrbit('-0.9563deg 50.53deg 0.8858m')">Front</button>
	<button onClick="setOrbit('87.21deg 92.24deg 0.8858m')">Side</button>
	<button onClick="setOrbit('-0.5451deg 135.5deg 0.8858m')">Bottom</button>
</div>

<div class="controls" style="position: absolute; bottom: 30px; left: 0px">
	<div>Variant: 
     	<button onClick="VBtn01()">01</button>
      	<button onClick="VBtn02()">02</button>
    	</div>
  </div>

  <div class="controls" style="position: absolute; bottom: 0px; left: 0px">
	<div>Animation: 
		<button id="default1Btn" onClick="Btn01()">head animation</button>
		<button id="default2Btn" onClick="Btn02()">handle animation</button>

	<button id="pauseBtn" onClick="pauseAnimation()">pause</button>
	</div>
</div>  




    </model-viewer> 
    





    <script> 
	function setOrbit(orbit) {
		document.getElementById('aqua').cameraOrbit = orbit;
	}
</script>

<script>
    function VBtn01() {
		document.getElementById('aqua').variantName = "v1";
    }

    function VBtn02() {
		document.getElementById('aqua').variantName = "v2";
	}


</script>

<script>

    function Btn01() {
			document.getElementById('aqua').pause();
			document.getElementById('aqua').animationName = "final design(FC53C4AC-6F24-4B04-9CFB-2EA5212CEA83)Action";
			document.getElementById('aqua').play();
		}
		function Btn02() {
			document.getElementById('aqua').pause();
			document.getElementById('aqua').animationName = "rotate_action";
			document.getElementById('aqua').play();
		}
	function pauseAnimation() {
			document.getElementById('aqua').pause();
		}


</script>

<script>
    
      function addhotspot1(){
			document.getElementById("hotspot1").style.visibility="visible"
		  }
		  function removehotspot1(){
			document.getElementById("hotspot1").style.visibility="hidden";
		  }
		  
		  function addhotspot2(){
			document.getElementById("hotspot2").style.visibility="visible"
		  }
		  function removehotspot2(){
			document.getElementById("hotspot2").style.visibility="hidden";
		  }

          function addhotspot3(){
			document.getElementById("hotspot3").style.visibility="visible"
		  }
		  function removehotspot3(){
			document.getElementById("hotspot3").style.visibility="hidden";
		  }

</script>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
